# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Install a browser for the dashboard tests
      run: |
        # tests/test_browser_mobile.py opens the built mobile dashboard and visits every section
        pip install playwright==1.56.0
        python -m playwright install --with-deps chromium
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

  # Runs the code of Abohashem-main.zip (unzipped in abohashem_main/) through
  # executive_dashboard/src/abohashem_main.py and checks the result is the committed
  # data/processed/abohashem_main.json. Switch off with the repository variable ABOHASHEM_MAIN=off.
  # The zip's own workflows (abohashem_main/.github/, including the PyPI publish) are not enabled.
  abohashem-main:
    if: ${{ vars.ABOHASHEM_MAIN != 'off' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install the tools its scripts need
      run: |
        sudo apt-get update && sudo apt-get install -y poppler-utils
        python -m pip install --upgrade pip
        pip install pymupdf openpyxl pytest
    - name: Run the Abohashem-main code
      working-directory: executive_dashboard
      run: |
        cp ../data/processed/abohashem_main.json /tmp/committed.json
        python -m src.abohashem_main
        cmp /tmp/committed.json ../data/processed/abohashem_main.json
    - name: Test
      run: pytest executive_dashboard/tests/test_abohashem_main.py -v
